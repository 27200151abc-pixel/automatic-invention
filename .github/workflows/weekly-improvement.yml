name: Weekly improvement review
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run review:weekly
      - name: Open review PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: automation/weekly-review
          delete-branch: true
          title: "docs: weekly learning prototype review"
          commit-message: "docs: refresh weekly review"
          body: "Documentation-only review queue. No lesson content is changed automatically."
          add-paths: docs/weekly-review-latest.md
